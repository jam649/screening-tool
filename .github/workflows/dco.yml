name: DCO
on:
  pull_request:
permissions:
  contents: read
jobs:
  sign-off:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify sign-offs on every contribution
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess
          commits = subprocess.check_output(['git', 'rev-list', f"{os.environ['BASE_SHA']}..{os.environ['HEAD_SHA']}"], text=True).splitlines()
          failures = []
          for commit in commits:
              body = subprocess.check_output(['git', 'show', '-s', '--format=%B', commit], text=True)
              if not re.search(r'^Signed-off-by: .+ <[^<>\s]+@[^<>\s]+>$', body, re.MULTILINE):
                  failures.append(commit)
          if failures:
              raise SystemExit('Missing DCO sign-off: ' + ', '.join(failures))
          print(f'Verified {len(commits)} commit sign-offs')
          PY
