name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.31"
          python-version: "3.12"
          enable-cache: true
      - working-directory: backend
        run: uv sync --frozen --extra dev
      - working-directory: backend
        run: uv run ruff check . ../scripts/gates
      - working-directory: backend
        run: uv run mypy app
      - working-directory: backend
        run: uv run pytest
      - working-directory: backend
        run: uv run pip-audit
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run lint && npm run typecheck && npm run build
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - working-directory: frontend
        run: npm test
      - working-directory: frontend
        run: npm audit
  compose-first-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Generate isolated encryption key
        run: python3 -c 'import base64,secrets; from datetime import datetime,timezone; print("SCREENING_TOOL_SECRET_KEY="+base64.urlsafe_b64encode(secrets.token_bytes(32)).decode()); print("TZ=Etc/GMT"+format(datetime.now(timezone.utc).hour-12, "+d"))' > .env
      - run: docker compose up --build -d --wait
      - working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium
      - working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8000
        run: npm test -- tests/setup.spec.ts
      - if: failure()
        run: docker compose logs --tail 100
      - if: always()
        run: docker compose down
  compose-csv-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Generate isolated encryption key
        run: python3 -c 'import base64,secrets; from datetime import datetime,timezone; print("SCREENING_TOOL_SECRET_KEY="+base64.urlsafe_b64encode(secrets.token_bytes(32)).decode()); print("TZ=Etc/GMT"+format(datetime.now(timezone.utc).hour-12, "+d"))' > .env
      - run: docker compose -p screening-tool-fixture-gates up --build -d --wait
      - working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium
      - name: Screen the real CSV fixture through the browser
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8000
          SCREENING_TOOL_GATE_CONTAINER: screening-tool-fixture-gates-screening-tool-1
        run: npm test -- tests/real-csv.spec.ts --workers=1
      - name: Work the real Reviewer queue and inspect historical evidence
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8000
          SCREENING_TOOL_REVIEW_GATE: "1"
          SCREENING_TOOL_GATE_CONTAINER: screening-tool-fixture-gates-screening-tool-1
        run: npm test -- tests/real-review.spec.ts --workers=1
      - if: failure()
        run: docker compose -p screening-tool-fixture-gates logs --tail 100
      - if: always()
        run: docker compose -p screening-tool-fixture-gates down --volumes

  compose-monitoring-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Generate isolated fixture encryption key
        run: python3 -c 'import base64,secrets; from datetime import datetime,timezone; print("SCREENING_TOOL_SECRET_KEY="+base64.urlsafe_b64encode(secrets.token_bytes(32)).decode()); print("TZ=Etc/GMT"+format(datetime.now(timezone.utc).hour-12, "+d"))' > .env
      - run: docker compose -p screening-tool-monitoring-fixture up --build -d --wait
      - working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium
      - name: Populate the untouched real CSV fixture
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8000
          SCREENING_TOOL_GATE_CONTAINER: screening-tool-monitoring-fixture-screening-tool-1
        run: npm test -- tests/real-csv.spec.ts --workers=1
      - name: Verify the real monitoring, email and evidence cycle
        run: |
          docker cp scripts/gates/milestone5.py screening-tool-monitoring-fixture-screening-tool-1:/tmp/milestone5.py
          docker exec screening-tool-monitoring-fixture-screening-tool-1 python /tmp/milestone5.py --run-fixture-gate
      - name: Restart and verify persistent schedules and original evidence
        run: |
          docker restart screening-tool-monitoring-fixture-screening-tool-1
          docker cp scripts/gates/milestone5_restart.py screening-tool-monitoring-fixture-screening-tool-1:/tmp/milestone5_restart.py
          docker exec screening-tool-monitoring-fixture-screening-tool-1 python /tmp/milestone5_restart.py --run-fixture-gate
      - name: Start anonymous loopback SMTP capture for the browser
        run: docker exec -d screening-tool-monitoring-fixture-screening-tool-1 python -m app.notifications.fixture --port 2525 --output-dir /data/milestone5-browser-smtp
      - name: Verify real Admin controls, deliveries, downloads and protected retention
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8000
          SCREENING_TOOL_M5_GATE: "1"
          SCREENING_TOOL_GATE_SMTP_PORT: "2525"
        run: npm test -- tests/real-monitoring.spec.ts --workers=1
      - if: failure()
        run: docker compose -p screening-tool-monitoring-fixture logs --tail 100
      - if: always()
        run: docker compose -p screening-tool-monitoring-fixture down --volumes

  compose-qbo-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Generate isolated fixture encryption key
        run: python3 -c 'import base64,secrets; from datetime import datetime,timezone; print("SCREENING_TOOL_SECRET_KEY="+base64.urlsafe_b64encode(secrets.token_bytes(32)).decode()); print("TZ=Etc/GMT"+format(datetime.now(timezone.utc).hour-12, "+d"))' > .env
      - name: Start a fresh packaged fixture API
        run: docker compose -f docker-compose.yml -f scripts/gates/milestone6-compose.yml -p screening-tool-qbo-api up --build -d --wait
      - name: Verify real OAuth, rotation, CDC, scoped evidence and export privacy
        run: docker exec screening-tool-qbo-api-screening-tool-1 python /tmp/milestone6.py --run-fixture-gate
      - name: Restart and verify frozen evidence and actual schedules
        run: |
          docker restart screening-tool-qbo-api-screening-tool-1
          docker compose -f docker-compose.yml -f scripts/gates/milestone6-compose.yml -p screening-tool-qbo-api up -d --wait
          docker exec screening-tool-qbo-api-screening-tool-1 python /tmp/milestone6.py --verify-restart
      - name: Preserve the API volume and start a separate fresh browser fixture
        run: |
          docker compose -f docker-compose.yml -f scripts/gates/milestone6-compose.yml -p screening-tool-qbo-api stop
          docker compose -f docker-compose.yml -f scripts/gates/milestone6-compose.yml -p screening-tool-qbo-browser up --build -d --wait
      - working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium
      - name: Work real QBO settings, sync, Reviewer history and revocation controls
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8000
          SCREENING_TOOL_M6_GATE: "1"
        run: npm test -- tests/real-qbo.spec.ts --workers=1
      - if: failure()
        run: |
          docker compose -f docker-compose.yml -f scripts/gates/milestone6-compose.yml -p screening-tool-qbo-api logs --tail 100
          docker compose -f docker-compose.yml -f scripts/gates/milestone6-compose.yml -p screening-tool-qbo-browser logs --tail 100
      - if: always()
        run: |
          docker compose -f docker-compose.yml -f scripts/gates/milestone6-compose.yml -p screening-tool-qbo-api down --volumes
          docker compose -f docker-compose.yml -f scripts/gates/milestone6-compose.yml -p screening-tool-qbo-browser down --volumes
