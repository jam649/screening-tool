services:
  screening-tool:
    build: .
    ports:
      - "127.0.0.1:${SCREENING_TOOL_PORT:-8000}:8000"
    environment:
      SCREENING_TOOL_SECRET_KEY: ${SCREENING_TOOL_SECRET_KEY:?Generate a Fernet key in .env first; see README}
      SCREENING_TOOL_DATABASE_URL: sqlite:////data/screening.db
      SCREENING_TOOL_FRONTEND_DIST: /app/frontend/dist
      TZ: ${TZ:-UTC}
    volumes:
      - screening-data:/data
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
volumes:
  screening-data:
