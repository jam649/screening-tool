services:
  screening-tool:
    build: .
    ports:
      - "127.0.0.1:${SCREENING_TOOL_PORT:-8000}:8000"
    environment:
      SCREENING_TOOL_SECRET_KEY: ${SCREENING_TOOL_SECRET_KEY:?Generate a Fernet key in .env first; see README}
      SCREENING_TOOL_DATABASE_URL: sqlite:////data/screening.db
      SCREENING_TOOL_FRONTEND_DIST: /app/frontend/dist
      SCREENING_TOOL_ALLOWED_HOSTS: '${SCREENING_TOOL_ALLOWED_HOSTS:-["localhost","127.0.0.1","::1"]}'
      SCREENING_TOOL_ALLOWED_ORIGINS: '${SCREENING_TOOL_ALLOWED_ORIGINS:-[]}'
      TZ: ${TZ:-UTC}
      FORWARDED_ALLOW_IPS: ${SCREENING_TOOL_FORWARDED_ALLOW_IPS:-127.0.0.1,::1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - screening-data:/data
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
volumes:
  screening-data:
