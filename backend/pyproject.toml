[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "screening-tool"
version = "0.1.0"
description = "Self-hosted Consolidated Screening List monitoring"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.20.0",
    "argon2-cffi==25.1.0",
    "cryptography==50.0.2",
    "defusedxml==0.7.1",
    "email-validator==2.3.0",
    "fastapi==0.143.0",
    "httpx==0.28.1",
    "metaphone==0.6",
    "openpyxl==3.1.5",
    "pycountry==26.2.16",
    "pydantic-settings==2.15.0",
    "python-multipart==0.0.32",
    "rapidfuzz==3.14.6",
    "sqlalchemy==2.1.4",
    "text-unidecode==1.3",
    "typer==0.27.3",
    "uvicorn[standard]==0.54.0",
]

[project.optional-dependencies]
dev = [
    "mypy==2.4.0",
    "pip-audit==2.10.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.0",
]

[project.scripts]
screening-tool = "app.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.wheel.force-include]
"alembic" = "app/migrations"
"alembic.ini" = "app/alembic.ini"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
